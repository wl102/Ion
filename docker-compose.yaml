services:
  ion:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ion:latest
    container_name: ion-agent
    ports:
      - "${ION_PORT:-8000}:${ION_PORT:-8000}"
    volumes:
      - ./data:/opt/ion/data
      - ./logs:/opt/ion/logs
      - ion_db_volume:/opt/ion/db
    env_file:
      - .env
    environment:
      - ION_DATABASE_URL=sqlite:////opt/ion/db/ion.db
    # Uncomment for host networking (useful for pentest scans)
    # network_mode: host
    restart: unless-stopped
    command: ["web"]

volumes:
  ion_db_volume:
